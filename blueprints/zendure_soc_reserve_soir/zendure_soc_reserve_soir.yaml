blueprint:
  name: Zendure - SOC Réserve Soir
  description: >
    Au coucher du soleil, calcule le SOC minimum à conserver pour couvrir
    la consommation du lendemain matin (6h → production solaire effective).
    S'adapte automatiquement aux saisons via sun.sun et à la capacité
    réelle des batteries via le capteur Zendure Manager.
    La réserve ne dépasse jamais la charge actuelle de chaque SolarFlow :
    elle arrête la décharge, sans jamais recharger sur le réseau en heures
    pleines.
  domain: automation
  input:
    soc_min_targets:
      name: SOC minimum SolarFlow
      description: >
        Sélectionner les entités SOC minimum de tous vos SolarFlow. La charge
        de chacun est lue sur son capteur de batterie (même appareil).
      selector:
        target:
          entity:
            domain: number
    total_capacity_sensor:
      name: Capacité totale batteries
      description: "Capteur de la capacité cumulée (en kWh), ex : sensor.zendure_manager_total_kwh"
      selector:
        entity:
          domain:
            - sensor
    avg_consumption:
      name: Consommation moyenne matin (W)
      description: >
        Consommation estimée entre 6h et l'arrivée du soleil.
        Compte le talon + petit-déjeuner, réveil, etc.
      default: 500
      selector:
        number:
          min: 100.0
          max: 2000.0
          unit_of_measurement: W
          step: 50.0
          mode: slider
    morning_start_hour:
      name: Début heures pleines matin
      description: Heure à partir de laquelle on couvre avec la batterie
      default: 6
      selector:
        number:
          min: 4.0
          max: 8.0
          step: 1.0
          mode: slider
    solar_offset_minutes:
      name: Décalage production solaire (min)
      description: >
        Minutes après le lever du soleil avant que la production couvre
        ta consommation (orientation panneaux, ombres, etc.)
      default: 60
      selector:
        number:
          min: 0.0
          max: 120.0
          step: 15.0
          mode: slider
    min_soc_floor:
      name: SOC plancher (%)
      description: Ne jamais descendre en dessous (protection batterie)
      default: 10
      selector:
        number:
          min: 5.0
          max: 30.0
          unit_of_measurement: "%"
          step: 1.0
          mode: slider
    max_soc_reserve:
      name: SOC réserve maximum (%)
      description: Plafond de la réserve même en plein hiver
      default: 45
      selector:
        number:
          min: 20.0
          max: 80.0
          unit_of_measurement: "%"
          step: 5.0
          mode: slider
triggers:
  - platform: sun
    event: sunset
  - platform: homeassistant
    event: start
conditions:
  - condition: sun
    after: sunset
variables:
  soc_targets: !input soc_min_targets
  consumption: !input avg_consumption
  capacity_sensor: !input total_capacity_sensor
  morning_hour: !input morning_start_hour
  solar_offset: !input solar_offset_minutes
  floor_soc: !input min_soc_floor
  ceiling_soc: !input max_soc_reserve
actions:
  - variables:
      sunrise_raw: >
        {{ state_attr('sun.sun', 'next_rising') }}
      calculated_soc: >
        {% if sunrise_raw is none %}
          {{ floor_soc }}
        {% else %}
          {% set sunrise = sunrise_raw | as_datetime | as_local %}
          {% set effective_sunrise = sunrise + timedelta(minutes=solar_offset) %}
          {% set morning = (now() + timedelta(days=1)).replace(hour=morning_hour | int, minute=0, second=0, microsecond=0) %}
          {% set hours = ((effective_sunrise - morning).total_seconds() / 3600) %}
          {% set hours = [hours, 0] | max %}
          {% set capacity = states(capacity_sensor) | float(4.8) * 1000 %}
          {% set needed = (hours * consumption / capacity * 100) | round(0) %}
          {% set soc = needed + floor_soc %}
          {{ [[soc, floor_soc] | max, ceiling_soc] | min }}
        {% endif %}
      # Entités SOC minimum ciblées (entités, ou appareils SolarFlow).
      soc_entities: >
        {% set ns = namespace(l=[]) %}
        {% set ids = soc_targets.entity_id if soc_targets.entity_id is defined else [] %}
        {% set ns.l = [ids] if ids is string else ids | list %}
        {% set devs = soc_targets.device_id if soc_targets.device_id is defined else [] %}
        {% for d in ([devs] if devs is string else devs) %}
          {% set ns.l = ns.l + (device_entities(d) | select('match', 'number[.].*min_soc$') | list) %}
        {% endfor %}
        {{ ns.l | unique | list }}
  # Une réserve au-dessus de la charge actuelle fait recharger le SolarFlow sur
  # le réseau pour l'atteindre : on la plafonne à la charge de chacun.
  - repeat:
      for_each: "{{ soc_entities }}"
      sequence:
        - variables:
            battery_sensor: >
              {{ device_entities(device_id(repeat.item)) | select('match', 'sensor[.]')
                 | select('is_state_attr', 'device_class', 'battery') | first | default('') }}
            current_soc: >
              {{ states(battery_sensor) | float(-1) if battery_sensor else -1 }}
            reserve_soc: >
              {% if current_soc | float < 0 %}
                {{ floor_soc | int }}
              {% else %}
                {{ [[calculated_soc | int, current_soc | int] | min, floor_soc | int] | max }}
              {% endif %}
        - action: number.set_value
          target:
            entity_id: "{{ repeat.item }}"
          data:
            value: "{{ reserve_soc }}"
        - action: logbook.log
          data:
            name: Zendure SOC Réserve
            entity_id: "{{ repeat.item }}"
            message: >
              SOC réserve {{ reserve_soc }}% (calculé {{ calculated_soc }}%,
              charge actuelle {{ current_soc | int if current_soc | float >= 0 else 'inconnue' }}%,
              capacité {{ states(capacity_sensor) }} kWh,
              sunrise demain {{ sunrise_raw | as_datetime | as_local | as_timestamp | timestamp_custom('%H:%M') if sunrise_raw else 'inconnu' }})
mode: single
